<div class="flex flex-col items-center max-w-screen-xl mx-auto px-4 py-6">
  <div class="flex flex-col w-full bg-white shadow-lg p-6 rounded-lg">
    <div class="text-2xl font-bold mb-6 text-gray-800">
      Document Summary Dashboard
    </div>

    <!-- Placeholder for summary output (optional) -->
    <div id="result" class="divText outputsection w-full border p-4 rounded-lg text-center text-gray-500 italic">
      Summary output processed successfully.
    </div>

    <!-- Actions (Copy, Download, Clear) -->
    <div class="flex gap-4 mt-4">
      <button type="button" class="uplBtn flex items-center bg-blue-600 hover:bg-blue-700 transition text-white px-4 py-2 rounded-md" id="copy">
        <img src="https://www.editpad.org/web_assets/frontend/images/new-icon/copy-icon.svg?v1.0" alt="Copy Icon" class="w-5 h-5 mr-2">
        Copy
      </button>
      <button type="button" class="uplBtn flex items-center bg-green-600 hover:bg-green-700 transition text-white px-4 py-2 rounded-md" id="capitalized" onclick="downloadReport()">
        <img src="https://www.editpad.org/web_assets/frontend/images/new-icon/download-icon.svg?v1.0" alt="Download Icon" class="w-5 h-5 mr-2">
        Download
      </button>
      <button type="button" class="uplBtn flex items-center bg-red-600 hover:bg-red-700 transition text-white px-4 py-2 rounded-md" onclick="clearIt()">
        <img src="https://www.editpad.org/web_assets/frontend/images/new-icon/remove-icon.svg" alt="Remove Icon" class="w-5 h-5 mr-2">
        Clear
      </button>
    </div>
  </div>
</div>

<!-- Summary Length Metrics -->
<div class="max-w-4xl mx-auto mt-8 space-y-6 px-4">
  <div class="bg-white shadow-md rounded-2xl p-6">
    <h2 class="text-xl font-semibold mb-4 text-gray-800">Summary Metrics</h2>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-center">
      <div class="bg-gray-50 border rounded-xl p-6 shadow-sm">
        <h3 class="text-gray-700 font-medium">Original Text Length</h3>
        <p class="mt-2 text-xl font-semibold text-indigo-600">{{ original_text_length }} characters</p>
      </div>
      <div class="bg-gray-50 border rounded-xl p-6 shadow-sm">
        <h3 class="text-gray-700 font-medium">Summarized Text Length</h3>
        <p class="mt-2 text-xl font-semibold text-indigo-600">{{ summarized_text_length }} characters</p>
      </div>
    </div>
  </div>

  <!-- Evaluation Plots Section -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white shadow-md rounded-2xl p-6 text-center">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">ROUGE Evaluation</h3>
      <img src="{{ rouge_plot_url }}" alt="ROUGE Plot" class="rounded-lg shadow-md mx-auto">
    </div>
    <div class="bg-white shadow-md rounded-2xl p-6 text-center">
      <h3 class="text-lg font-semibold text-gray-700 mb-4">Length Comparison</h3>
      <img src="{{ length_plot_url }}" alt="Length Plot" class="rounded-lg shadow-md mx-auto">
    </div>
  </div>
</div>
